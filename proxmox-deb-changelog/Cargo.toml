[package]
name = "proxmox-deb-changelog"
description = "Parser for Debian changelogs"
version = "0.1.0"

authors.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
# NOTE: keep the core dependencies minimal, pull in anything else through an optional feature.

proxmox-deb-version.workspace = true
proxmox-schema = { workspace = true, optional = true, features = ["api-macro"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt"] }

proxmox-http-error = { workspace = true, optional = true }
proxmox-router = { workspace = true, optional = true }

[features]
default = []
api-types = ["dep:proxmox-schema"]
impl = ["dep:flate2", "dep:thiserror"]
api = [
    "api-types",
    "impl",
    "dep:anyhow",
    "dep:proxmox-http-error",
    "dep:proxmox-router",
    "dep:serde_json",
    "dep:tokio",
    "proxmox-schema/api-types",
]

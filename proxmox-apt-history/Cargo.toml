[package]
name = "proxmox-apt-history"
description = "Parsers for the logs APT keeps about package changes"
version = "0.1.1"

authors.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

proxmox-deb-changelog.workspace = true
# NOTE: keep the core dependencies minimal, pull in anything else through an optional feature.

log = { workspace = true, optional = true }

proxmox-schema = { workspace = true, optional = true, features = ["api-macro"] }
proxmox-serde = { workspace = true, optional = true, features = ["perl"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flate2.workspace = true
libc.workspace = true
proxmox-time.workspace = true

anyhow = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }

proxmox-http-error = { workspace = true, optional = true }
proxmox-router = { workspace = true, optional = true }

[features]
default = []
api-types = ["dep:proxmox-schema", "dep:proxmox-serde", "proxmox-deb-changelog/api-types"]
impl = ["api-types", "dep:log", "proxmox-deb-changelog/impl"]
api = [
    "impl",
    "dep:anyhow",
    "dep:proxmox-http-error",
    "dep:proxmox-router",
    "dep:serde_json",
    "dep:tokio",
    "proxmox-schema/api-types",
]

[dev-dependencies]
serde_json.workspace = true

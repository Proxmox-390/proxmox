[package]
name = "proxmox-access-log"
description = "Parser for the API access logs of Proxmox products"
version = "0.1.1"

authors.workspace = true
edition.workspace = true
exclude.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
log = { workspace = true, optional = true }
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["rt", "sync"] }
zstd = { workspace = true, optional = true }

proxmox-router = { workspace = true, optional = true }
proxmox-schema = { workspace = true, optional = true, features = ["api-macro", "api-types"] }

[dev-dependencies]
serde_json.workspace = true

[features]
default = []
api = ["api-types", "query", "dep:proxmox-router", "dep:serde_json", "dep:tokio"]
api-types = ["dep:proxmox-schema"]
query = ["dep:anyhow", "dep:flate2", "dep:libc", "dep:log", "dep:zstd"]

[[test]]
name = "api"
required-features = ["api"]

[[test]]
name = "api_path"
required-features = ["api"]

[[test]]
name = "query"
required-features = ["query"]
